<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeitplanrechner Klettern</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <h1>Zeitplanrechner</h1>
    <input id="eventName" type="text" placeholder="Name des Events" value="Neues Event">
  </div>
  <div class="topbar-right">
    <button id="btnExport" class="btn-secondary">Export JSON</button>
    <label class="btn-secondary file-label">
      Import JSON
      <input id="btnImport" type="file" accept="application/json" hidden>
    </label>
    <button id="btnReset" class="btn-danger">Alles löschen</button>
  </div>
</header>

<section class="days-bar">
  <span class="days-label">Wettkampftage:</span>
  <div id="daysList" class="days-list"></div>
  <button id="btnAddDay" class="btn-small">+ Tag hinzufügen</button>
</section>

<main class="layout">
  <aside class="sidebar">
    <h2>Runden</h2>
    <div class="add-round-buttons">
      <button class="btn-add btn-boulder" data-discipline="boulder">+ Bouldern</button>
      <button class="btn-add btn-lead" data-discipline="lead">+ Lead</button>
      <button class="btn-add btn-speed" data-discipline="speed">+ Speed</button>
    </div>
    <ul id="roundList" class="round-list"></ul>
  </aside>

  <section class="editor" id="editorPanel">
    <div class="editor-empty">Wähle links eine Runde aus oder lege eine neue an.</div>
  </section>
</main>

<section class="gantt-section">
  <div class="gantt-header">
    <h2>Zeitplan</h2>
    <div class="gantt-legend">
      <span class="legend-item"><span class="legend-swatch swatch-boulder"></span>Bouldern</span>
      <span class="legend-item"><span class="legend-swatch swatch-lead"></span>Lead</span>
      <span class="legend-item"><span class="legend-swatch swatch-speed"></span>Speed</span>
    </div>
    <button id="btnPrintGantt" class="btn-secondary">🖨 Als PDF drucken</button>
  </div>
  <div id="ganttContainer" class="gantt-container"></div>
</section>

<script src="js/state.js"></script>
<script src="js/presets.js"></script>
<script src="js/calc-boulder.js"></script>
<script src="js/calc-lead.js"></script>
<script src="js/calc-speed.js"></script>
<script src="js/gantt.js"></script>
<script src="js/app.js"></script>
</body>
</html>
